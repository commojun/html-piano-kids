<!doctype html>
<html lang="ja" data-icon="🎹" data-color="#fff4e6">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>どれみ ぴあの</title>
  <link rel="stylesheet" href="common/base.css">
  <style>
    body { background: linear-gradient(#fff9db, #ffe8cc); }
    /* 押した音の絵と字が浮かぶところ */
    #stage { position: fixed; top: 0; left: 0; right: 0; height: 30%; pointer-events: none; }
    .pop { position: absolute; bottom: 8px; transform: translateX(-50%); display: flex; flex-direction: column;
      align-items: center; line-height: 1; animation: rise 1.1s ease-out forwards; }
    .pop .em { font-size: min(14vh, 12vw); }
    .pop .on { font-size: min(9vh, 8vw); font-weight: bold; color: var(--c); -webkit-text-stroke: 2px #fff; paint-order: stroke; }
    @keyframes rise {
      0% { transform: translate(-50%, 30px) scale(.4); opacity: 0; }
      20% { transform: translate(-50%, 0) scale(1.15); opacity: 1; }
      35% { transform: translate(-50%, 0) scale(1); }
      100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
    }
    /* 本物のピアノに寄せた鍵盤: 白鍵はすき間なく並べ、黒鍵は本物と同じ位置 (ド# レ# ファ# ソ# ラ#) に重ねる */
    #piano { position: fixed; top: 30%; left: 10px; right: 10px; bottom: 12px; border-radius: 10px 10px 14px 14px;
      background: #3b2a20; padding: 0 6px 8px; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
    #felt { height: 14px; margin: 0 -6px; border-radius: 10px 10px 0 0; background: linear-gradient(#7a1f2b, #5c1520); }
    #keys { position: relative; height: calc(100% - 14px); display: flex; }
    .key {
      flex: 1; min-width: 0; position: relative; touch-action: none;
      background: linear-gradient(#fdfcf7 0 85%, #ece7da); border: 1px solid #b9b2a3; border-top: none; border-radius: 0 0 8px 8px;
      box-shadow: inset 0 -6px 0 #e3ddcf, 0 3px 0 #9c9586; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; gap: 6px; padding-bottom: 18px; transition: transform .05s;
    }
    .key + .key { margin-left: -1px; }
    .key.on { transform: translateY(4px); box-shadow: inset 0 -2px 0 #e3ddcf, 0 0 0 #9c9586;
      background: linear-gradient(var(--bg) 0 85%, #ece7da); }
    .black {
      position: absolute; top: 0; height: 60%; width: calc(100% / 8 * .58); z-index: 2; touch-action: none;
      background: linear-gradient(90deg, #2b2b2b, #111 30%, #000 70%, #222); border-radius: 0 0 5px 5px;
      box-shadow: inset 0 -10px 0 #333, inset 2px 0 0 #444, 0 4px 3px rgba(0,0,0,.45);
      transform: translateX(-50%); transition: transform .05s;
    }
    .black.on { background: linear-gradient(90deg, #3a3a3a, #222 30%, #1a1a1a 70%, #333); box-shadow: inset 0 -4px 0 #333, 0 1px 2px rgba(0,0,0,.4);
      transform: translateX(-50%) translateY(3px); }
    .key .em { font-size: min(9vw, 9vh); line-height: 1; pointer-events: none; }
    .key .on-name { font-size: min(5vw, 6vh); font-weight: bold; color: var(--c); line-height: 1; pointer-events: none; white-space: nowrap; }
    .key .name { font-size: min(2.4vw, 2.6vh, 20px); font-weight: bold; color: #868e96; pointer-events: none; white-space: nowrap; }
    /* おんめいモードでも 鍵盤の絵 (どんぐり…) と表示は変えない。変わるのは声だけ */
    /* 声の切り替え なし / ことば / おんめい (親向けに右上へ控えめに) */
    #voice { position: fixed; top: 12px; right: 12px; width: 56px; height: 56px; border: none; border-radius: 50%;
      background: rgba(255,255,255,.7); font-size: 28px; padding: 0; touch-action: none; }
    #voice.off { opacity: .4; }
    /* 鍵盤の外を触ったときに ふわっと浮かぶ 小さな音符 */
    .puff { position: fixed; pointer-events: none; z-index: 5; font-size: 30px; line-height: 1; color: var(--c);
      animation: puff 1s ease-out forwards; }
    @keyframes puff { from { transform: translate(-50%, -50%) scale(.4); opacity: .9; }
      to { transform: translate(calc(-50% + var(--dx)), calc(-50% - 60px)) scale(1); opacity: 0; } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="piano"><div id="felt"></div><div id="keys"></div></div>
  <button id="voice" aria-label="こえ">🔇</button>
  <script src="common/kit.js"></script>
  <script>
    // どれみぴあの: ド〜高いド の白鍵 8 本。江口メソッドの初歩の「ことばで覚えるドレミ」
    // ど=どんぐり れ=れもん み=みかん ふぁ=ふえ そ=そっくす ら=らっぱ し=しゃつ
    // [音名, 絵, ことば, 半音 (ド=0), 色]
    const NOTES = [
      ["ど", "🌰", "どんぐり", 0, "#a0522d"],
      ["れ", "🍋", "れもん", 2, "#f59f00"],
      ["み", "🍊", "みかん", 4, "#fd7e14"],
      ["ふぁ", "🪈", "ふえ", 5, "#2f9e44"],
      ["そ", "🧦", "そっくす", 7, "#e64980"],
      ["ら", "🎺", "らっぱ", 9, "#d4a017"],
      ["し", "👕", "しゃつ", 11, "#1c7ed6"],
      ["ど", "🌰", "どんぐり", 12, "#a0522d"],
    ];
    // 「ふぁ」の「ぁ」は丸ゴシックだと「あ」と見分けにくいので、さらに小さく
    const kana = (s) => s.replace(/[ぁぃぅぇぉゃゅょ]/g, '<small style="font-size:.6em">$&</small>');
    const freq = (semi) => 261.63 * Math.pow(2, semi / 12); // ド = C4

    const keys = document.getElementById("keys");
    const stage = document.getElementById("stage");
    const els = NOTES.map(([on, em, word, , c], i) => {
      const k = document.createElement("div");
      k.className = "key";
      k.dataset.i = i;
      k.style.setProperty("--c", c);
      k.style.setProperty("--bg", c + "22");
      k.innerHTML = `<span class="em">${em}</span><span class="on-name">${kana(on)}</span><span class="name">${word}</span>`;
      keys.appendChild(k);
      return k;
    });
    // 黒鍵 (ラベルなし)。[左どなりの白鍵の番号, 半音, 本物どおりの ずれ (黒鍵の幅に対する割合)]
    // ド#・ファ# は少し左、レ#・ラ# は少し右、ソ# はまんなか。ミ-ファ、シ-ド の間には ない
    const BLACKS = [[0, 1, -0.15], [1, 3, 0.15], [3, 6, -0.18], [4, 8, 0], [5, 10, 0.18]];
    BLACKS.forEach(([w, semi, off], j) => {
      const b = document.createElement("div");
      b.className = "black";
      b.dataset.i = NOTES.length + j;
      b.style.left = `calc(100% / 8 * ${w + 1} + 100% / 8 * .58 * ${off})`;
      keys.appendChild(b);
      els.push(b);
    });

    // ---- 声の切り替え: なし 🔇 → ことば 🌰 (どんぐり…) → おんめい 🎵 (ど・れ・み…) → なし ----
    const voiceBtn = document.getElementById("voice");
    const MODES = ["off", "word", "solfa"];
    const MODE_ICON = { off: "🔇", word: "🌰", solfa: "🎵" };
    // デフォルトは なし。前の ON/OFF (doremi-voice2) が ON だった端末は「ことば」として引き継ぐ
    let mode = "off";
    try {
      const m = localStorage.getItem("doremi-voice3");
      if (MODES.includes(m)) mode = m;
      else if (localStorage.getItem("doremi-voice2") === "on") mode = "word";
    } catch (e) {}
    const syncVoice = () => {
      voiceBtn.textContent = MODE_ICON[mode];
      voiceBtn.classList.toggle("off", mode === "off");
      document.body.classList.toggle("solfa", mode === "solfa");
    };
    syncVoice();
    voiceBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      try { localStorage.setItem("doremi-voice3", mode); } catch (e) {}
      syncVoice();
      Kit.tone({ off: 440, word: 550, solfa: 660 }[mode], { dur: 0.12, type: "triangle", vol: 0.3 });
    });
    // 読み上げはカタカナで渡す (ひらがなだと助詞読みされることがある)
    const toKatakana = (s) => s.replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
    // 速く弾いているときは読み上げが追いつかず遅れて聞こえるので、少し落ち着いてから最後の音だけ読む
    let sayTimer = null;
    const sayLater = (word) => {
      clearTimeout(sayTimer);
      sayTimer = setTimeout(() => Kit.say(toKatakana(word), { pitch: 1.3, rate: 1 }), 180);
    };

    // ---- 音程つきの声 ----
    // ことば: 「どんぐり」を ドの高さで、「れもん」を レの高さで言う (sounds/do.mp3 …)
    // おんめい: 「ど」「れ」「み」… を その鍵盤の高さで 少し伸ばして歌う (sounds/solfa-do.mp3 …)
    // どちらも Open JTalk の声 mei を WORLD で その音の高さに固定して作ったもの (tools/singvoice)。
    // 読めなければ ふつうの読み上げに もどる
    const SUNG = ["do", "re", "mi", "fa", "so", "ra", "si", "do2"];
    const sung = { word: [], solfa: [] };
    const load = (m, prefix) => SUNG.forEach((n, i) => {
      fetch(`sounds/${prefix}${n}.mp3`).then((r) => (r.ok ? r.arrayBuffer() : Promise.reject()))
        .then((b) => Kit.audio().decodeAudioData(b)).then((buf) => (sung[m][i] = buf)).catch(() => {});
    });
    load("word", "");
    load("solfa", "solfa-");
    let sungSrc = null;
    const sing = (i) => {
      const buf = sung[mode][i];
      if (!buf) { sayLater(mode === "solfa" ? NOTES[i][0] : NOTES[i][2]); return; }
      const c = Kit.audio();
      if (sungSrc) { try { sungSrc.stop(); } catch (e) {} }
      const s = c.createBufferSource();
      const gn = c.createGain();
      gn.gain.value = 0.9;
      s.buffer = buf;
      s.connect(gn).connect(c.destination);
      s.start(c.currentTime + 0.03);
      sungSrc = s;
    };

    // ---- 音: ピアノっぽく (アタックが強く、ゆっくり減衰) ----
    const play = (semi) => {
      const f = freq(semi);
      Kit.tone(f, { dur: 1.4, type: "triangle", vol: 0.5 });
      Kit.tone(f * 2, { dur: 0.6, type: "sine", vol: 0.14 });
      Kit.tone(f * 3, { dur: 0.25, type: "sine", vol: 0.05 });
    };

    const press = (i) => {
      const k = els[i];
      if (i >= NOTES.length) {
        // 黒鍵: 音と 小さな ♪ だけ (名前は よまない)
        play(BLACKS[i - NOTES.length][1]);
        k.classList.add("on");
        const r = k.getBoundingClientRect();
        const p = document.createElement("div");
        p.className = "pop";
        p.style.left = r.left + r.width / 2 + "px";
        p.innerHTML = `<span class="em" style="font-size:min(9vh,8vw)">🎵</span>`;
        stage.appendChild(p);
        setTimeout(() => p.remove(), 1100);
        return;
      }
      const [on, em, , semi, c] = NOTES[i];
      play(semi);
      k.classList.add("on");
      const r = k.getBoundingClientRect();
      const p = document.createElement("div");
      p.className = "pop";
      p.style.left = r.left + r.width / 2 + "px";
      p.style.setProperty("--c", c);
      p.innerHTML = `<span class="em">${em}</span><span class="on">${kana(on)}</span>`;
      stage.appendChild(p);
      setTimeout(() => p.remove(), 1100);
      if (mode !== "off") sing(i);
    };
    const release = (i) => els[i] && els[i].classList.remove("on");
    const keyAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      const k = el && el.closest(".key, .black");
      return k ? +k.dataset.i : -1;
    };

    // 指をすべらせても鳴る (グリッサンド)。マルチタッチで和音も
    const active = new Map(); // pointerId -> 押している鍵
    keys.addEventListener("pointerdown", (e) => {
      const i = keyAt(e.clientX, e.clientY);
      if (i < 0) return;
      active.set(e.pointerId, i);
      press(i);
    });
    addEventListener("pointermove", (e) => {
      if (!active.has(e.pointerId)) return;
      const i = keyAt(e.clientX, e.clientY);
      const prev = active.get(e.pointerId);
      if (i >= 0 && i !== prev) {
        release(prev);
        active.set(e.pointerId, i);
        press(i);
      }
    });
    const up = (e) => {
      release(active.get(e.pointerId));
      active.delete(e.pointerId);
    };
    addEventListener("pointerup", up);
    addEventListener("pointercancel", up);

    // 鍵盤の外 (上の空き・ピアノの枠) を触ったら、小さな音符が ふわっと浮かんで 控えめに ぽろん
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".kit-home, #voice") || keyAt(e.clientX, e.clientY) >= 0) return;
      const f = document.createElement("div");
      f.className = "puff";
      f.textContent = Kit.pick(["♪", "♫", "🎵"]);
      f.style.left = e.clientX + "px";
      f.style.top = e.clientY + "px";
      f.style.setProperty("--c", Kit.pick(NOTES)[4]);
      f.style.setProperty("--dx", Kit.rand(-25, 25) + "px");
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1050);
      Kit.tone(Kit.noteFreq(Math.floor(Kit.rand(0, 6)), 72), { dur: 0.25, type: "sine", vol: 0.12 });
    });
  </script>
  <div id="credit" style="position:fixed;right:8px;bottom:2px;font-size:9px;color:rgba(80,60,40,.55);pointer-events:none;z-index:5">voice: HTS Voice "Mei" (NITech, CC BY 3.0) / Open JTalk</div>
</body>
</html>
